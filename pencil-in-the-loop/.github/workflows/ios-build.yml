# The first real compiler this code ever meets.
#
# Nothing in this repository can be compiled on the machine it was written on, so
# CI is not a safety net here — it is the build. Push, read the log, and you have
# a complete error list before Xcode is opened. Everything is therefore hard-fail:
# a green tick that hid a compile error would be worse than useless.

name: iOS build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build (macOS)
    runs-on: macos-15
    continue-on-error: false
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      # Fastest possible signal: this fails in seconds on a manifest error or a
      # dependency-resolution failure, before any target has been built.
      - name: Resolve package dependencies
        working-directory: PencilLoopKit
        run: swift package resolve

      # A host build of the package. It compiles the modules with no project
      # file, no signing and no simulator involved, so a failure here is
      # unambiguously a problem in PencilLoopKit rather than in the app targets.
      #
      # This step stops being valid the moment AppUI or Annotate imports UIKit,
      # PencilKit or SwiftData for real — those do not build for macOS. Delete
      # this step then; the iOS build below covers the same ground.
      - name: Build PencilLoopKit for the host
        working-directory: PencilLoopKit
        run: swift build

      # The same package, built for iOS. Xcode synthesises a scheme for a package
      # directory, so this needs no project file either.
      - name: Build PencilLoopKit for iOS
        working-directory: PencilLoopKit
        run: |
          xcodebuild build \
            -scheme PencilLoopKit \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # The app and the embedded share extension. Code signing is off: the point
      # is compiler errors, and signing needs a team ID that is not in the repo.
      - name: Build the app
        run: |
          xcodebuild build \
            -project PencilLoop.xcodeproj \
            -scheme PencilLoop \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run package tests
        working-directory: PencilLoopKit
        run: swift test

  check:
    name: Project checks (Linux)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The lint suite is pure stdlib Python on purpose: it runs anywhere, and it
      # catches the project-file and plist mistakes that a compiler never sees.
      - name: Run project checks
        run: make -C tooling check
